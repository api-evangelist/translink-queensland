  data_subject_request:
    url: https://translink.com.au/legal/privacy
    section: Access, amendment and deletion
    note: >-
      Under the Information Privacy Act 2009 (Qld), people can ask for access to and amendment of their personal
      information. They can ask for deletion of mobile-app accounts and of data tied to Meta-integrated services.
      Requests go through the relevant online service or app, or through the contact form. Translink can refuse on
      public-interest grounds or to meet record-keeping duties. The page mentions no portability right and no API
      for these requests.
