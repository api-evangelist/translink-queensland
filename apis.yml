aid: translink-queensland

name: Translink

description: 'Translink is the public transport division of the Queensland Government''s Department of Transport and Main
  Roads, with statewide responsibility for buses, trains, ferries and trams across South East Queensland, regional bus services,
  demand responsive transit, taxi regulation and long distance rail, coach and regional air services. Through its open data
  program Translink publishes GTFS schedule datasets and unauthenticated GTFS Realtime v2.0 (Protobuf) feeds of trip updates,
  vehicle positions and alerts at gtfsrt.api.translink.com.au, licensed CC BY 4.0. (Harvest source: australia-apidays-2026.)'

