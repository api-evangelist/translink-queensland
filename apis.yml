apis:
- aid: translink-queensland:gtfs-realtime
  name: Translink GTFS Realtime Feeds
  description: 'Unauthenticated GTFS Realtime v2.0 feeds, encoded in Protobuf, of trip updates, vehicle positions and service
    alerts for South East Queensland (whole network and per mode: bus, rail, tram, ferry) and Cairns. Translink states its
    implementation is based on the gtfs-realtime.proto definition at gtfs.org, and that the feeds must be used with its GTFS
    schedules. Licensed CC BY 4.0.'
  humanURL: https://translink.com.au/about-translink/open-data
  baseURL: https://gtfsrt.api.translink.com.au/api/realtime
  tags:
  - GTFS Realtime
  - Protobuf
  - Transit
  - Open Data
  properties:
  - type: Protobuf
    url: grpc/translink-queensland-gtfs-realtime.proto
    name: gtfs-realtime.proto
    description: Verbatim copy of the GTFS Realtime protobuf definition (GTFS Specifications Authors, github.com/google/transit).
      Translink does not author it; its open data page states "Our implementation of GTFS-RT v2 is based on this gtfs-realtime.proto"
      and links https://gtfs.org/documentation/realtime/proto/.
  - type: Documentation
    url: https://translink.com.au/about-translink/open-data
  - type: TermsOfService
    url: https://translink.com.au/about-translink/open-data/terms-and-conditions
- aid: translink-queensland:gtfs-schedules
  name: Translink GTFS Schedule Datasets
  description: GTFS static schedule datasets (timetables, route paths, stopping patterns) for SEQ bus, train, ferry and tram
    services and Queensland regional bus services, published as downloadable resources on the Queensland Government open data
    portal (data.qld.gov.au).
  humanURL: https://translink.com.au/about-translink/open-data
  tags:
  - GTFS
  - Transit
  - Open Data
  properties:
  - type: Documentation
    url: https://translink.com.au/about-translink/open-data
  - type: Dataset
    url: https://www.data.qld.gov.au/dataset/general-transit-feed-specification-gtfs-translink

